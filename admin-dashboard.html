<!doctype html><html lang="en" class="dark"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Eugene Card — Admin Dashboard</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="./js/supabase-init.js"></script><script src="https://cdn.tailwindcss.com"></script></head><body class="min-h-screen bg-slate-950 text-white"><main class="max-w-6xl mx-auto px-6 py-12"><div class="flex items-center justify-between mb-10"><div><p class="text-amber-400 text-sm font-semibold">EUGENE CARD ADMIN</p><h1 class="text-4xl font-bold mt-2">Admin Dashboard</h1><p id="welcome" class="text-slate-400 mt-2">Loading your admin profile…</p></div><button id="logout" class="rounded-xl bg-slate-800 px-4 py-2 hover:bg-slate-700">Log out</button></div><section class="grid md:grid-cols-3 gap-5"><a href="./index.html" class="rounded-2xl border border-slate-800 bg-slate-900 p-6 hover:border-amber-500"><h2 class="font-semibold text-lg">Marketplace</h2><p class="text-slate-400 mt-2">Return to Eugene Card.</p></a><div class="rounded-2xl border border-slate-800 bg-slate-900 p-6"><h2 class="font-semibold text-lg">Administration</h2><p class="text-slate-400 mt-2">Manage the Eugene Card platform and review account data.</p></div><div class="rounded-2xl border border-slate-800 bg-slate-900 p-6"><h2 class="font-semibold text-lg">Admin Account</h2><p id="email" class="text-slate-400 mt-2"></p></div></section></main><script>const sb=window.supabaseClient;const admins=['eugene.aquila06@gmail.com','eugenecard.market@gmail.com'];(async()=>{const {data}=await sb.auth.getSession();if(!data.session){location.replace('./index.html');return}const u=data.session.user;if(!admins.includes((u.email||'').toLowerCase())){location.replace('./user-dashboard.html');return}const {data:p}=await sb.from('profiles').select('*').eq('id',u.id).maybeSingle();if(p?.role!=='admin'){location.replace('./user-dashboard.html');return}document.getElementById('welcome').textContent=`Welcome, ${p.display_name||u.email}`;document.getElementById('email').textContent=u.email||'';document.getElementById('logout').onclick=async()=>{await sb.auth.signOut();location.replace('./index.html')}})()</script></body></html>
