name: Wire Supabase card views
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add card views loader
        shell: python
        run: |
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          marker='<!-- SUPABASE CARD VIEWS -->'
          if marker not in s:
              needle='<script src="./js/inventory-supabase.js"></script>'
              replacement=needle+'\n  '+marker+'\n  <script src="./js/card-views-supabase.js"></script>'
              if needle not in s: raise SystemExit('inventory script anchor not found')
              s=s.replace(needle,replacement,1)
              p.write_text(s,encoding='utf-8')
      - name: Commit
        shell: bash
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Wire Supabase card view counter [skip ci]"
          git push
