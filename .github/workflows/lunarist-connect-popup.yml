name: Ensure Lunarist connect approval popup

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch Lunarist connect approval flow
        shell: python
        run: |
          from pathlib import Path
          p = Path('js/lunarist-integration.js')
          s = p.read_text(encoding='utf-8')

          marker = '/* EUGENE_LUNARIST_CALLBACK_APPROVAL_V1 */'
          if marker in s:
              print('Callback approval already present')
              raise SystemExit(0)

          needle = "const t=await waitForLunaristSession();"
          if needle not in s:
              raise SystemExit('Expected OAuth session wait marker not found')

          replacement = """const approved=await approveLunaristConnection();
          if(!approved){clearOAuthState();history.replaceState({},'',location.pathname+location.hash);return}
          /* EUGENE_LUNARIST_CALLBACK_APPROVAL_V1 */
          const t=await waitForLunaristSession();"""

          s = s.replace(needle, replacement, 1)
          p.write_text(s, encoding='utf-8')
      - name: Commit patch
        shell: bash
        run: |
          if git diff --quiet -- js/lunarist-integration.js; then
            echo "No changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/lunarist-integration.js
          git commit -m "Require approval before Lunarist OAuth exchange [skip ci]"
          git push
