name: Fix secondary page admin access

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate admin pages exist
        run: |
          set -e
          for file in admin-command-center.html analytics.html revenue.html; do
            test -f "$file"
            echo "Found $file"
          done

      - name: Validate embedded JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          import subprocess
          import tempfile

          files = ['admin-command-center.html', 'analytics.html', 'revenue.html']
          for name in files:
              html = Path(name).read_text(encoding='utf-8')
              scripts = re.findall(r'<script(?:\\s[^>]*)?>(.*?)</script>', html, re.S | re.I)
              if not scripts:
                  raise SystemExit(f'No embedded scripts found in {name}')
              for index, script in enumerate(scripts, 1):
                  if not script.strip():
                      continue
                  with tempfile.NamedTemporaryFile('w', suffix='.js', delete=False, encoding='utf-8') as f:
                      f.write(script)
                      temp = f.name
                  result = subprocess.run(['node', '--check', temp], text=True, capture_output=True)
                  if result.returncode:
                      print(result.stderr)
                      raise SystemExit(f'JavaScript syntax error in {name}, script {index}')
              print(f'JavaScript syntax OK: {name}')
          PY

      - name: Validate admin allowlist and Supabase auth hooks
        run: |
          set -e
          for file in admin-command-center.html analytics.html revenue.html; do
            grep -Eq 'eugene\.aquila06@gmail\.com|eugenecard\.market@gmail\.com' "$file"
            grep -Eq 'supabase|auth|getUser|onAuthStateChange' "$file"
            echo "Admin auth markers OK: $file"
          done
