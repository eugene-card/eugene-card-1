name: Fix secondary page admin access

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Normalize admin authentication
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          files = ['admin-command-center.html', 'analytics.html', 'revenue.html']
          replacement = "const ADMIN_EMAILS = ['eugene.aquila06@gmail.com', 'eugenecard.market@gmail.com'];"
          pattern = re.compile(r"const\s+ADMIN_EMAILS\s*=\s*\[[^\]]*\]\s*;", re.S)

          auth_replacement = '''window.auth = {
            onAuthStateChanged(cb) {
              let stopped = false;
              let lastUserId = undefined;
              const emit = (user) => {
                if (stopped) return;
                const id = user?.id || null;
                if (id === lastUserId) return;
                lastUserId = id;
                cb(user || null);
              };
              // Wait for Supabase to restore the persisted session before authorizing.
              client.auth.getSession().then(({ data }) => emit(data?.session?.user || null));
              const { data } = client.auth.onAuthStateChange((_event, session) => {
                emit(session?.user || null);
              });
              return () => { stopped = true; data.subscription.unsubscribe(); };
            },
            async signInWithPopup() {
              return { data: null, error: new Error('Use the marketplace login page to sign in.') };
            }
          };'''
          auth_pattern = re.compile(r"window\.auth\s*=\s*\{.*?\n\s*\};", re.S)

          admin_fn = '''async function isUserAdmin(user) {
      if (!user) return false;
      const email = (user.email || '').trim().toLowerCase();
      if (ADMIN_EMAILS.some(e => email === e)) return true;
      try {
        const { data, error } = await window.supabaseClient
          .from('profiles')
          .select('role')
          .eq('id', user.id)
          .maybeSingle();
        return !error && String(data?.role || '').toLowerCase() === 'admin';
      } catch (e) {
        console.error('Admin role check failed:', e);
        return false;
      }
    }'''
          admin_pattern = re.compile(r"function\s+isUserAdmin\s*\(user\)\s*\{.*?\n\s*\}", re.S)

          guard_pattern = re.compile(r"auth\.onAuthStateChanged\(user\s*=>\s*\{\s*if\s*\(!user\s*\|\|\s*!isUserAdmin\(user\)\)\s*\{", re.S)
          guard_replacement = "auth.onAuthStateChanged(async user => {\n        if (!user || !(await isUserAdmin(user))) {"

          changed = False
          for name in files:
              p = Path(name)
              s = p.read_text()
              new = pattern.sub(replacement, s, count=1)
              new = auth_pattern.sub(auth_replacement, new, count=1)
              new = admin_pattern.sub(admin_fn, new, count=1)
              new = guard_pattern.sub(guard_replacement, new, count=1)
              if new != s:
                  p.write_text(new)
                  changed = True
          if not changed:
              print('Admin authentication already normalized.')
          PY
      - name: Commit fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add admin-command-center.html analytics.html revenue.html
          if git diff --cached --quiet; then
            echo 'No admin authentication changes needed.'
          else
            git commit -m 'Fix secondary admin session and role authorization [skip ci]'
            git push
          fi
