name: Wire Supabase admin pages
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  wire:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Wire shared Supabase bridge
        run: |
          python3 - <<'PY'
          from pathlib import Path
          tag = '<script src="js/ec-admin-bridge.js"></script>'
          for name in ['admin-command-center.html','analytics.html','revenue.html']:
              p = Path(name)
              text = p.read_text(encoding='utf-8')
              if tag not in text:
                  marker = '</body>'
                  if marker not in text:
                      raise SystemExit(f'Missing </body> in {name}')
                  text = text.replace(marker, f'  {tag}\n{marker}', 1)
                  p.write_text(text, encoding='utf-8')
          PY
      - name: Commit wired pages
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add admin-command-center.html analytics.html revenue.html js/ec-admin-bridge.js
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Wire admin pages to Supabase and marketplace'
          git push
