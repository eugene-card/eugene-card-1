name: Repair social feed

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Repair index script loading
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          firebase = '  <script src="./js/supabase-firebase-compat.js"></script>\n'
          alias = '  <script src="./js/supabase-supabase-compat.js"></script>\n'
          while s.count(firebase) > 1:
              s = s.replace(firebase, '', 1)
          while s.count(alias) > 1:
              s = s.replace(alias, '', 1)
          if firebase in s and alias not in s:
              s = s.replace(firebase, firebase + alias, 1)
          elif firebase not in s:
              marker = '  <script src="./js/supabase-init.js"></script>\n'
              if marker in s and alias not in s:
                  s = s.replace(marker, marker + firebase + alias, 1)

          app = '  <script src="./js/app.js"></script>\n'
          if app not in s:
              marker = alias if alias in s else (firebase if firebase in s else '  <script src="./js/supabase-init.js"></script>\n')
              s = s.replace(marker, marker + app, 1)

          p.write_text(s, encoding='utf-8')

      - name: Commit repair
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then
            echo 'No changes needed'
            exit 0
          fi
          git commit -m 'Restore Supabase FieldValue compatibility for social interactions [skip ci]'
          git push
