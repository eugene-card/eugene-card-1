name: Fix Lunarist OAuth state migration

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  migrate-oauth-state:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Patch OAuth state migration and PKCE verifier
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('js/lunarist-integration.js')
          s = p.read_text()
          old = "function random(){const a=new Uint8Array(16);crypto.getRandomValues(a);return[...a].map(x=>x.toString(16).padStart(2,'0')).join('')}"
          new = "function random(bytes=16){const a=new Uint8Array(bytes);crypto.getRandomValues(a);return[...a].map(x=>x.toString(16).padStart(2,'0')).join('')}"
          if old in s:
              s = s.replace(old, new, 1)
          old_start = "const state=random(),verifier=random(),challenge=await sha(verifier);"
          new_start = "const state=random(16),verifier=random(32),challenge=await sha(verifier);"
          if old_start in s:
              s = s.replace(old_start, new_start, 1)
          p.write_text(s)
          PY

      - name: Commit PKCE fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/lunarist-integration.js
          git diff --cached --quiet && exit 0
          git commit -m "Fix Eugene Card PKCE verifier length [skip ci]"
          git push origin main
