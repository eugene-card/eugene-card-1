name: Remove legacy Inventory wiring

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Clean Inventory legacy wording
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()
          original = s
          # Remove stale storage-provider wording only.
          for a, b in {
            'Firestore': 'Supabase',
            'firestore': 'supabase',
            'Firebase': 'Supabase',
            'firebase': 'supabase',
          }.items():
            s = s.replace(a, b)
          # Keep the shared compatibility layer for non-inventory features.
          marker = '  <script src="./js/supabase-init.js"></script>\n'
          compat = '  <script src="./js/supabase-firebase-compat.js"></script>\n'
          native = '  <script src="./js/inventory-supabase.js"></script>\n'
          if marker in s:
            if compat not in s:
              s = s.replace(marker, marker + compat)
            if native not in s:
              s = s.replace(compat, compat + native)
          if s != original:
            p.write_text(s)
          PY
      - name: Commit cleanup
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then
            echo 'No cleanup changes needed.'
          else
            git commit -m 'Remove Firestore wording from Inventory [skip ci]'
            git push
          fi
