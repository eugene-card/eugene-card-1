name: Remove legacy Inventory wiring

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Clean Inventory legacy wording
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()
          original = s
          for a, b in {
            'Firestore': 'Supabase',
            'firestore': 'supabase',
            'Firebase': 'Supabase',
            'firebase': 'supabase',
          }.items():
            s = s.replace(a, b)
          marker = '  <script src="./js/supabase-init.js"></script>\n'
          compat = '  <script src="./js/supabase-firebase-compat.js"></script>\n'
          native = '  <script src="./js/inventory-supabase.js"></script>\n'
          if marker in s:
            if compat not in s:
              s = s.replace(marker, marker + compat)
            if native not in s:
              s = s.replace(compat, compat + native)
          if s != original:
            p.write_text(s)
          PY

      - name: Repair secondary-page admin authentication
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          files = ['admin-command-center.html', 'analytics.html', 'revenue.html']
          allowlist = "const ADMIN_EMAILS = ['eugene.aquila06@gmail.com', 'eugenecard.market@gmail.com'];"
          allowlist_pattern = re.compile(r"const\s+ADMIN_EMAILS\s*=\s*\[[^\]]*\]\s*;", re.S)
          bridge = '  <script src="./js/admin-auth-bridge.js"></script>\n'

          for name in files:
            p = Path(name)
            s = p.read_text()
            s = allowlist_pattern.sub(allowlist, s, count=1)
            if './js/admin-auth-bridge.js' not in s:
              s = s.replace('</body>', bridge + '</body>', 1)
            p.write_text(s)
          PY

      - name: Commit cleanup and admin repair
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html admin-command-center.html analytics.html revenue.html
          if git diff --cached --quiet; then
            echo 'No cleanup or admin changes needed.'
          else
            git commit -m 'Fix secondary admin authentication [skip ci]'
            git push
          fi
