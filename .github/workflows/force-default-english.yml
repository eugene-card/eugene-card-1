name: Force Eugene Card default language to English

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  english-default:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply EN default
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()
          s = s.replace('<html lang="id"', '<html lang="en"', 1)
          tag = '<script src="./js/language-default-en.js"></script>'
          if tag not in s:
              s = s.replace('</head>', f'  {tag}\n</head>', 1)
          p.write_text(s)
          PY
      - name: Commit EN default
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html js/language-default-en.js
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Set English as default language [skip ci]"
          git push
