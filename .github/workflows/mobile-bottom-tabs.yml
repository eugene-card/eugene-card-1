name: Move mobile tabs to floating bottom navigation

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply mobile navigation and modal stacking styles
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          marker = '/* EUGENE_MOBILE_MODAL_STACK_V2 */'
          if marker in s:
              print('Mobile modal stacking patch already present')
              raise SystemExit(0)

          css = r'''
<style id="eugene-mobile-modal-stack-v2">
/* EUGENE_MOBILE_MODAL_STACK_V2 */
@media (max-width: 768px) {
  /* The mobile navigation remains usable, but every popup/drawer is above it. */
  header.sticky { z-index:1000 !important; }
  header nav { z-index:1000 !important; }
  .mobile-nav { z-index:1000 !important; }

  #profile-manager-modal,
  #complete-profile-modal,
  #admin-edit-collector-modal,
  #generic-confirm-modal,
  #auction-winner-modal,
  #auth-modal,
  #card-detail-modal,
  #image-preview-modal,
  #onboarding-modal,
  #loading-modal,
  #chat-drawer-overlay,
  #cart-drawer-overlay {
    z-index:20000 !important;
  }

  #cart-drawer {
    z-index:20001 !important;
    top:0 !important;
    bottom:0 !important;
    height:100dvh !important;
    max-height:100dvh !important;
    padding-top:max(16px, env(safe-area-inset-top)) !important;
    padding-bottom:max(16px, env(safe-area-inset-bottom)) !important;
    overflow-y:auto !important;
    -webkit-overflow-scrolling:touch;
  }

  #profile-manager-modal {
    z-index:20000 !important;
    padding-top:max(10px, env(safe-area-inset-top)) !important;
    padding-bottom:max(10px, env(safe-area-inset-bottom)) !important;
  }

  #profile-manager-modal .profile-manager-modal-panel {
    max-height:calc(100dvh - max(20px, env(safe-area-inset-top)) - max(20px, env(safe-area-inset-bottom))) !important;
  }

  #profile-manager-modal .profile-manager-modal-panel > button:first-child,
  #cart-drawer > div:first-child button,
  #complete-profile-modal > div:first-child > button,
  #admin-edit-collector-modal > div:first-child > button {
    z-index:50 !important;
    touch-action:manipulation !important;
  }

  /* Avoid browser scroll chaining while a popup is open. */
  #profile-manager-modal,
  #cart-drawer-overlay,
  #cart-drawer {
    overscroll-behavior:contain !important;
  }
}
</style>
'''
          if '</head>' not in s:
              raise SystemExit('Could not find </head> in index.html')
          s = s.replace('</head>', css + '\n</head>', 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit patch
        shell: bash
        run: |
          if git diff --quiet -- index.html; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Fix mobile profile and cart popup stacking [skip ci]"
          git push
