<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Eugene Card</title>
  <link rel="icon" href="./eugene-card-icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./styles.css">
  <link rel="stylesheet" href="./social-home.css">
  <style>
    body{margin:0;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f6f7fb;color:#16181d}
    .ec-shell{max-width:980px;margin:0 auto;padding:28px 18px}
    .ec-nav{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:12px 0 24px}
    .ec-brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:20px}
    .ec-brand img{width:38px;height:38px}
    .ec-actions{display:flex;gap:8px}
    button{border:0;border-radius:10px;padding:10px 16px;font-weight:700;cursor:pointer}
    .primary{background:#111;color:white}.secondary{background:white;border:1px solid #ddd}
    .card{background:white;border:1px solid #e4e5e8;border-radius:18px;padding:24px;box-shadow:0 8px 30px rgba(0,0,0,.05)}
    .hero{margin-top:24px}.hero h1{font-size:42px;line-height:1.05;margin:0 0 12px}
    .auth{max-width:440px;margin:28px 0}.field{display:block;margin:14px 0}.field span{display:block;font-size:13px;font-weight:700;margin-bottom:7px}
    input{width:100%;box-sizing:border-box;border:1px solid #d9dbe1;border-radius:10px;padding:12px;font-size:15px}
    .error{color:#b42318;margin-top:12px;font-size:14px}.muted{color:#6b7280}.status{font-size:14px;color:#555}
    .status-dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#20a464;margin-right:6px}.status-dot.guest{background:#999}
    .profile{display:flex;align-items:center;gap:14px}.avatar{width:64px;height:64px;border-radius:50%;background:#eee;object-fit:cover}
  </style>
</head>
<body>
  <div class="ec-shell">
    <nav class="ec-nav">
      <div class="ec-brand"><img src="./eugene-card-icon.svg" alt=""> Eugene Card</div>
      <div class="ec-actions">
        <span id="authStatus" class="status"></span>
        
        <button id="logoutButton" class="secondary" hidden>Logout</button>
      </div>
    </nav>

    <main>
      <section class="card hero">
        <h1>Collect. Trade. Connect.</h1>
        <p class="muted">Eugene Card runs on Supabase authentication and database services.</p>
      </section>

      <section id="loginPanel" class="card auth">
        <h2>Welcome back</h2>
        <p class="muted">Sign in securely with your Google account.</p><p class="muted" style="font-size:12px">Google login requires Supabase Google Provider to be enabled.</p>
        <button id="loginButton" class="primary" type="button">Continue with Google</button>
        <div id="loginError" class="error"></div>
      </section>

      <section id="accountPanel" class="card auth" hidden>
        <div class="profile">
          <div class="avatar"></div>
          <div>
            <h2 id="profileName" style="margin:0"></h2>
            <div id="profileUsername" class="muted"></div>
            <div id="profileEmail" class="muted"></div>
          </div>
        </div>
      </section>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.0"></script>
  <script src="./js/supabase-config.js"></script>
  <script src="./js/app.js"></script>
</body>
</html>
