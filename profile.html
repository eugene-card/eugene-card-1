<!doctype html>
<html lang="en" class="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#030712">
<title>Eugene Card Vault</title>
<style>
html,body{margin:0;width:100%;height:100%;background:#030712;overflow:hidden}
#vault-frame{display:block;width:100%;height:100%;border:0;background:#030712}
#loading{position:fixed;inset:0;display:grid;place-items:center;background:#030712;color:#94a3b8;font:600 14px Inter,system-ui,sans-serif;z-index:2;transition:opacity .2s ease}
#loading.hidden{opacity:0;pointer-events:none}
</style>
</head>
<body>
<div id="loading">Loading Vault…</div>
<iframe id="vault-frame" title="Eugene Card Vault" src="/" loading="eager"></iframe>
<script>
(()=>{
 const frame=document.getElementById('vault-frame');
 const loading=document.getElementById('loading');
 const raw=(new URLSearchParams(location.search).get('username')||location.pathname.split('/').filter(Boolean)[0]||'').trim().replace(/^@/,'').toLowerCase();
 const valid=/^[a-z0-9_.-]{1,64}$/.test(raw);
 if(!valid){loading.textContent='Profile not found';return;}
 document.title=`@${raw} · Eugene Card Vault`;
 let activated=false;
 let guardTimer=null;
 let returning=false;
 function applyVault(){
   try{
     const w=frame.contentWindow,d=w.document;
     if(typeof w.openHolderVaultModal!=='function')return false;
     const view=d.getElementById('view-holder-vault');
     const alreadyVisible=view && !view.classList.contains('hidden') && getComputedStyle(view).display!=='none';
     if(!alreadyVisible) w.openHolderVaultModal(raw);
     const hide='header, body > header, nav, #loginPanel, #accountPanel, #loginButton, #logoutButton';
     d.querySelectorAll(hide).forEach(el=>el.style.display='none');
     const main=d.querySelector('main');
     if(main){main.style.paddingTop='18px';main.style.paddingLeft='12px';main.style.paddingRight='12px';}
     const vault=d.getElementById('view-holder-vault');
     if(vault){vault.classList.remove('hidden');vault.style.display='block';}
     d.querySelectorAll('[id^="view-"]').forEach(el=>{if(el.id!=='view-holder-vault')el.classList.add('hidden');});
     bindBackButton(d);
     loading.classList.add('hidden');
     if(!activated){
       activated=true;
       guardTimer=setInterval(()=>{
         if(returning)return;
         try{
           const v=frame.contentWindow.document.getElementById('view-holder-vault');
           const visible=v && !v.classList.contains('hidden') && getComputedStyle(v).display!=='none';
           if(!visible) applyVault();
           else bindBackButton(frame.contentWindow.document);
         }catch(e){}
       },500);
     }
     return true;
   }catch(e){console.error('Public Vault bootstrap failed',e);return false;}
 }
 function bindBackButton(d){
   d.querySelectorAll('button,a,[role="button"]').forEach(el=>{
     const label=(el.textContent||'').replace(/\s+/g,' ').trim().toLowerCase();
     if(!label.includes('kembali ke kolektor'))return;
     if(el.dataset.ecBackBound==='1')return;
     el.dataset.ecBackBound='1';
     el.addEventListener('click',()=>{
       returning=true;
       if(guardTimer)clearInterval(guardTimer);
       window.top.location.href='/';
     },true);
   });
 }
 frame.addEventListener('load',()=>{
   let tries=0;
   const timer=setInterval(()=>{
     tries++;
     if(applyVault()||tries>120){clearInterval(timer);if(tries>120){loading.textContent='Vault unavailable';loading.classList.remove('hidden')}}
   },100);
 });
 window.addEventListener('beforeunload',()=>{if(guardTimer)clearInterval(guardTimer);});
})();
</script>
</body>
</html>
