<!doctype html>
<html lang="en" class="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#030712">
<title>Eugene Card Vault</title>
<style>
html,body{margin:0;width:100%;height:100%;background:#030712;overflow:hidden}
#vault-frame{display:block;width:100%;height:100%;border:0;background:#030712}
#loading{position:fixed;inset:0;display:grid;place-items:center;background:#030712;color:#94a3b8;font:600 14px Inter,system-ui,sans-serif;z-index:2;transition:opacity .2s ease}
#loading.hidden{opacity:0;pointer-events:none}
</style>
</head>
<body>
<div id="loading">Loading Vault…</div>
<iframe id="vault-frame" title="Eugene Card Vault" src="/" loading="eager"></iframe>
<script>
(()=>{
 const frame=document.getElementById('vault-frame');
 const loading=document.getElementById('loading');
 const raw=(new URLSearchParams(location.search).get('username')||location.pathname.split('/').filter(Boolean)[0]||'').trim().replace(/^@/,'').toLowerCase();
 const valid=/^[a-z0-9_.-]{1,64}$/.test(raw);
 if(!valid){loading.textContent='Profile not found';return;}
 document.title=`@${raw} · Eugene Card Vault`;
 function showVault(){
   try{
     const w=frame.contentWindow,d=w.document;
     if(typeof w.openHolderVaultModal!=='function')return false;
     w.openHolderVaultModal(raw);
     const hide='header, body > header, nav, #loginPanel, #accountPanel, #loginButton, #logoutButton';
     d.querySelectorAll(hide).forEach(el=>el.style.display='none');
     const main=d.querySelector('main');
     if(main){main.style.paddingTop='18px';main.style.paddingLeft='12px';main.style.paddingRight='12px';}
     const view=d.getElementById('view-holder-vault');
     if(view){view.classList.remove('hidden');view.style.display='block';}
     const allViews=d.querySelectorAll('[id^="view-"]');
     allViews.forEach(el=>{if(el.id!=='view-holder-vault')el.classList.add('hidden');});
     loading.classList.add('hidden');
     return true;
   }catch(e){console.error('Public Vault bootstrap failed',e);return false;}
 }
 frame.addEventListener('load',()=>{
   let tries=0;
   const timer=setInterval(()=>{
     tries++;
     if(showVault()||tries>100){clearInterval(timer);if(tries>100){loading.textContent='Vault unavailable';loading.classList.remove('hidden')}}
   },100);
 });
})();
</script>
</body>
</html>
