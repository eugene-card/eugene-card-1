<!doctype html>
<html lang="en" class="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#030712">
  <title>Eugene Card Profile</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="./js/supabase-config.js"></script>
  <style>
    :root{color-scheme:dark;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;color:#f8fafc;background:#030712;overflow-x:hidden}
    body:before{content:"";position:fixed;inset:0;pointer-events:none;background:radial-gradient(circle at 15% 0%,rgba(99,102,241,.2),transparent 38%),radial-gradient(circle at 85% 12%,rgba(245,158,11,.14),transparent 34%),linear-gradient(rgba(255,255,255,.018) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.018) 1px,transparent 1px);background-size:auto,auto,40px 40px,40px 40px}
    main{position:relative;min-height:100vh;display:grid;place-items:center;padding:32px 18px}
    .shell{width:min(680px,100%);border:1px solid rgba(148,163,184,.16);border-radius:28px;background:linear-gradient(145deg,rgba(15,23,42,.9),rgba(2,6,23,.82));box-shadow:0 30px 100px rgba(0,0,0,.45);backdrop-filter:blur(20px);overflow:hidden}
    .hero{padding:38px 28px 30px;text-align:center;border-bottom:1px solid rgba(148,163,184,.1)}
    .avatar{width:112px;height:112px;border-radius:999px;object-fit:cover;margin:0 auto 18px;border:3px solid rgba(251,191,36,.7);background:#111827;box-shadow:0 0 35px rgba(245,158,11,.18)}
    .fallback-avatar{display:grid;place-items:center;font-size:40px;font-weight:800;color:#fde68a;background:linear-gradient(135deg,#312e81,#92400e)}
    h1{margin:0;font-size:32px;letter-spacing:-.03em}.username{margin-top:6px;color:#94a3b8;font-size:15px}.bio{max-width:560px;margin:16px auto 0;color:#cbd5e1;line-height:1.65;white-space:pre-wrap}
    .content{padding:26px}.links{display:grid;gap:12px}.link{display:flex;align-items:center;justify-content:center;min-height:48px;padding:12px 16px;border-radius:14px;border:1px solid rgba(148,163,184,.15);background:rgba(15,23,42,.68);color:#f8fafc;text-decoration:none;font-weight:650}.link:hover{border-color:rgba(251,191,36,.55);transform:translateY(-1px)}
    .meta{margin-top:24px;text-align:center;color:#64748b;font-size:12px}.home{display:inline-block;margin-top:22px;color:#fbbf24;text-decoration:none;font-size:13px;font-weight:700}
    .state{text-align:center;padding:70px 28px}.state h1{font-size:28px}.state p{color:#94a3b8;line-height:1.6}.spinner{width:34px;height:34px;border:3px solid rgba(148,163,184,.25);border-top-color:#fbbf24;border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 20px}@keyframes spin{to{transform:rotate(360deg)}}
    @media(max-width:520px){.hero{padding:30px 20px}.content{padding:20px}h1{font-size:27px}}
  </style>
</head>
<body>
<main><section class="shell" id="app"><div class="state"><div class="spinner"></div><p>Loading profile…</p></div></section></main>
<script>
(() => {
  const app = document.getElementById('app');
  const cfg = window.SUPABASE_CONFIG || {};
  const params = new URLSearchParams(location.search);
  const rawUsername = params.get('username') || location.pathname.split('/').filter(Boolean)[0] || '';
  const username = rawUsername.trim().replace(/^@/, '').toLowerCase();

  const escapeHtml = (value='') => String(value).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
  const normalizeUrl = (value='') => {
    const v = String(value).trim();
    if (!v) return '';
    try { const u = new URL(/^https?:\/\//i.test(v) ? v : `https://${v}`); return /^https?:$/.test(u.protocol) ? u.href : ''; }
    catch { return ''; }
  };
  const showState = (title, message, back=true) => {
    app.innerHTML = `<div class="state"><h1>${escapeHtml(title)}</h1><p>${escapeHtml(message)}</p>${back ? '<a class="home" href="/">← Back to Eugene Card</a>' : ''}</div>`;
  };

  if (!username || !/^[a-z0-9_\-.]{1,64}$/.test(username)) {
    showState('Profile not found', 'That Eugene Card username is not valid.');
    return;
  }
  if (!window.supabase || !cfg.url || !cfg.anonKey) {
    showState('Profile unavailable', 'Eugene Card could not initialize its public profile service.');
    return;
  }

  const client = window.supabase.createClient(cfg.url, cfg.anonKey);
  client.from('profiles').select('username,display_name,avatar_url,bio,instagram,tiktok,x_url,website').ilike('username', username).maybeSingle().then(({data,error}) => {
    if (error) {
      console.error('Public profile lookup failed:', error);
      showState('Profile unavailable', 'The public profile service is temporarily unavailable.');
      return;
    }
    if (!data) {
      showState('Profile not found', `No Eugene Card profile exists for @${username}.`);
      return;
    }

    const displayName = data.display_name || data.username || username;
    const initial = escapeHtml(displayName.trim().charAt(0).toUpperCase() || 'E');
    const avatar = normalizeUrl(data.avatar_url);
    const links = [];
    const addLink = (label, value) => { const url = normalizeUrl(value); if (url) links.push(`<a class="link" href="${escapeHtml(url)}" target="_blank" rel="noopener noreferrer">${escapeHtml(label)}</a>`); };
    if (data.instagram) addLink('Instagram', `https://instagram.com/${String(data.instagram).replace(/^@/,'')}`);
    if (data.tiktok) addLink('TikTok', `https://tiktok.com/@${String(data.tiktok).replace(/^@/,'')}`);
    if (data.x_url) addLink('X / Twitter', data.x_url);
    if (data.website) addLink('Website', data.website);

    document.title = `${displayName} (@${data.username || username}) · Eugene Card`;
    app.innerHTML = `<div class="hero">
      ${avatar ? `<img class="avatar" src="${escapeHtml(avatar)}" alt="${escapeHtml(displayName)}" onerror="this.outerHTML='<div class=\"avatar fallback-avatar\">${initial}</div>'">` : `<div class="avatar fallback-avatar">${initial}</div>`}
      <h1>${escapeHtml(displayName)}</h1>
      <div class="username">@${escapeHtml(data.username || username)}</div>
      ${data.bio ? `<div class="bio">${escapeHtml(data.bio)}</div>` : ''}
    </div>
    <div class="content">
      ${links.length ? `<div class="links">${links.join('')}</div>` : '<div class="meta">No public links added yet.</div>'}
      <div class="meta">Public Eugene Card profile</div>
      <a class="home" href="/">← Open Eugene Card</a>
    </div>`;
  });
})();
</script>
</body>
</html>
