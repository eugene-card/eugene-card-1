<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>EUGENE CARD — Admin Revenue & Financial Hub</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>body{font-family:system-ui;margin:0;background:#0b1020;color:#eef2ff;padding:28px}.wrap{max-width:1100px;margin:auto}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px}.card{background:#141b2f;border:1px solid #273250;border-radius:14px;padding:18px}.v{font-size:28px;font-weight:800;margin-top:8px}.muted{color:#9aa6c0}.ok{color:#65d391}.err{color:#ff7d7d}table{width:100%;border-collapse:collapse;margin-top:16px}th,td{text-align:left;padding:10px;border-bottom:1px solid #273250}button{background:#fff;color:#111;border:0;border-radius:9px;padding:10px 14px;font-weight:700}</style></head><body><div class="wrap"><h1>EUGENE CARD</h1><h2>ADMIN REVENUE &amp; FINANCIAL HUB</h2><p class="muted">Canonical Supabase financial records · <span id="status">Checking…</span></p><button onclick="load()">Refresh</button><div class="grid" style="margin-top:18px"><div class="card">Transactions<div class="v" id="tx">—</div></div><div class="card">Gross Volume<div class="v" id="gross">—</div></div><div class="card">Platform Revenue<div class="v" id="revenue">—</div></div><div class="card">Average Sale<div class="v" id="avg">—</div></div></div><div class="card" style="margin-top:18px"><h3>Recent Financial Records</h3><table><thead><tr><th>Date</th><th>Type</th><th>Status</th><th>Amount</th></tr></thead><tbody id="rows"><tr><td colspan="4" class="muted">Loading…</td></tr></tbody></table></div></div><script>const SUPABASE_URL='https://tsjgvzpzfjyecnginipt.supabase.co';const SUPABASE_ANON_KEY='sb_publishable_eyJhbGciOiJIUzI1NiIsImtpZCI6Ijk4Y2Q2ZjA4LTQ0NjgtNGI0MS1hOTQxLTUyMDUzNTJjYTRhIiwicm9sZSI6ImFub24ifQ.XxR6Xf2Yx8k4K9u9cG8m7mQ8mQ8mQ8mQ8mQ8mQ8mQ8';const db=supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);const money=n=>new Intl.NumberFormat('en-US',{style:'currency',currency:'USD'}).format(Number(n)||0);function amount(x){if(x==null)return 0;if(typeof x==='number')return x;if(typeof x==='string')return Number(x.replace(/[^0-9.-]/g,''))||0;if(typeof x==='object')return amount(x.amount??x.total??x.price??x.value);return 0}function normalize(r){const d=r.data||{};return{date:r.created_at||r.updated_at||d.created_at||d.date,type:d.type||d.kind||d.transaction_type||'Transaction',status:d.status||r.status||'completed',amount:amount(d.amount??d.total??d.price??d.sale_price??d.value??r.amount)}}async function load(){const s=document.getElementById('status');s.textContent='Loading…';s.className='muted';try{const{data,error}=await db.from('documents').select('id,collection,data,created_at,updated_at').eq('collection','transactions').order('created_at',{ascending:false}).limit(500);if(error)throw error;const rows=(data||[]).map(normalize);const completed=rows.filter(x=>!['cancelled','canceled','failed','refunded'].includes(String(x.status).toLowerCase()));const gross=completed.reduce((a,x)=>a+x.amount,0);const platform=completed.reduce((a,x)=>a+x.amount*0.05,0);document.getElementById('tx').textContent=rows.length;document.getElementById('gross').textContent=money(gross);document.getElementById('revenue').textContent=money(platform);document.getElementById('avg').textContent=money(completed.length?gross/completed.length:0);document.getElementById('rows').innerHTML=rows.slice(0,25).map(x=>`<tr><td>${x.date?new Date(x.date).toLocaleString():'—'}</td><td>${String(x.type)}</td><td>${String(x.status)}</td><td>${money(x.amount)}</td></tr>`).join('')||'<tr><td colspan="4" class="muted">No transaction records found.</td></tr>';s.textContent='Database connected';s.className='ok'}catch(e){s.textContent='Database error: '+(e.message||e);s.className='err';document.getElementById('rows').innerHTML='<tr><td colspan="4" class="err">Unable to load financial records.</td></tr>'}}load();</script></body></html>
